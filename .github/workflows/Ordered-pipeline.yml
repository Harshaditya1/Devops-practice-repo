name: Ordered Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup complete
        run: echo "Setup done"

  verify:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Node version
        run: node -v

      - name: Verify complete
        run: echo "Verify done"

  finish:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Finish pipeline
        run: echo "Pipeline finished"