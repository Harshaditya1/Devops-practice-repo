name: Python inspector

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Inspect Python installation
        run: |
          python --version
          pip --version
          which python
          echo "Inspection complete"

           